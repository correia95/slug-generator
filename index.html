    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "URL Slug Generator",
        "url": "https://slug-generator.correia95.workers.dev/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Generate clean URL slugs from titles, with accent transliteration, symbol-to-word conversion, separator and length options and a bulk mode, entirely in the browser."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is a URL slug?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The slug is the readable part of a URL that identifies a page, like my-first-post in /blog/my-first-post. A good slug is short, lowercase and made of real words separated by hyphens."
            }
          },
          {
            "@type": "Question",
            "name": "Should I use hyphens or underscores in a slug?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Hyphens. Search engines treat a hyphen as a word separator and an underscore as a word joiner, so red-shoes is read as two words and red_shoes as one."
            }
          },
          {
            "@type": "Question",
            "name": "How are accented characters handled?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "They are transliterated to their plain form: café becomes cafe, Straße becomes strasse, Łódź becomes lodz. Turn off ASCII only to keep non-Latin scripts as they are."
            }
          },
          {
            "@type": "Question",
            "name": "Can I generate many slugs at once?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Paste one title per line and each gets its own slug, with a Copy all button for the whole list."
            }
          }
        ]
      }
    </script>
